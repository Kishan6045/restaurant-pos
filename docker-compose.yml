services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Change DB name as you like
      MONGODB_URI: mongodb://mongo:27017/restaurant_pos
      # REQUIRED for auth
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      # OPTIONAL (only needed for Cloudinary uploads)
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY:-}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET:-}
      # Optional logging
      LOG_ENABLED: ${LOG_ENABLED:-false}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        # Optional: set to an absolute backend URL if deploying frontend separately
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
